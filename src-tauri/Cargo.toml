[package]
name = "ditalist-desktop"
version.workspace = true
edition.workspace = true
default-run = "DitaListRust"

[features]
# Explicit isolated release-performance build; candidate packaging omits it.
motion-diagnostics = []

[[bin]]
name = "DitaListRust"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ditalist-contracts.workspace = true
ditalist-core.workspace = true
ditalist-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-winrt-notification = "0.8"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
windows-numerics = "=0.3.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_System_Registry", "Win32_System_Diagnostics_Debug"] }
