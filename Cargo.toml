[workspace]
members = ["crates/contracts", "crates/core", "crates/mcp", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
schemars = { version = "1", features = ["chrono04", "uuid1"] }
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl"] }
ditalist-contracts = { path = "crates/contracts" }
ditalist-core = { path = "crates/core" }
ditalist-mcp = { path = "crates/mcp" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
